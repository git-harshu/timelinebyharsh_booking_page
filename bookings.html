<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard — 1:1 Bookings | Harsh (@timelinebyharsh)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563EB;
      --primary-hover: #1D4ED8;
      --dark: #0F172A;
      --text: #1E293B;
      --text-muted: #64748B;
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --border: #E2E8F0;
      --success: #059669;
      --success-light: #ECFDF5;
      --radius-sm: 8px;
      --radius-md: 12px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 4rem;
    }

    .container {
      width: 100%;
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 1.25rem;
    }

    header {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 0;
      margin-bottom: 2rem;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-avatar {
      width: 2.4rem;
      height: 2.4rem;
      border-radius: var(--radius-sm);
      background: var(--dark);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1.1rem;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--dark);
    }

    .token-box {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .token-box input {
      font-family: inherit;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.55rem 0.85rem;
      font-size: 0.875rem;
      width: 240px;
    }

    .token-box button {
      background: var(--primary);
      color: #fff;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.875rem;
      border: none;
      border-radius: var(--radius-sm);
      padding: 0.55rem 1rem;
      cursor: pointer;
    }

    .token-box button:hover {
      background: var(--primary-hover);
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.25rem 1.5rem;
      box-shadow: var(--shadow-sm);
    }

    .stat-title {
      font-size: 0.825rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-value {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--dark);
      margin-top: 0.25rem;
    }

    .table-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .table-head-bar {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .table-head-bar h2 {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--dark);
    }

    .search-input {
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.45rem 0.85rem;
      font-size: 0.875rem;
      width: 220px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.875rem;
    }

    th {
      background: #F8FAFC;
      padding: 0.85rem 1.25rem;
      font-weight: 700;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      color: var(--text);
    }

    tr:hover td {
      background: #FAFAFC;
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      background: #EFF6FF;
      color: var(--primary);
    }

    .wa-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: #25D366;
      color: #fff;
      padding: 0.35rem 0.75rem;
      border-radius: var(--radius-sm);
      font-size: 0.775rem;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .wa-btn:hover {
      background: #1EBE5D;
    }

    .empty-state {
      padding: 3.5rem 1.5rem;
      text-align: center;
      color: var(--text-muted);
    }

    .error-msg {
      background: #FEE2E2;
      color: #DC2626;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      margin-bottom: 1rem;
      font-size: 0.875rem;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="container header-inner">
      <div class="brand">
        <div class="brand-avatar">H</div>
        <div>
          <h1>Bookings Dashboard</h1>
          <p style="font-size:0.75rem;color:var(--text-muted)">Harsh · @timelinebyharsh</p>
        </div>
      </div>

      <div class="token-box">
        <input type="password" id="adminTokenInput" placeholder="Enter ADMIN_TOKEN" autocomplete="current-password">
        <button id="loadBtn">Load Bookings</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="errorBanner" class="error-msg"></div>

    <div class="stats-row" id="statsRow" style="display:none">
      <div class="stat-card">
        <div class="stat-title">Total Bookings</div>
        <div class="stat-value" id="totalBookings">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Total Revenue</div>
        <div class="stat-value" id="totalRevenue">₹0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Average Fee</div>
        <div class="stat-value">₹299</div>
      </div>
    </div>

    <div class="table-card">
      <div class="table-head-bar">
        <h2>All 1:1 Appointments</h2>
        <input type="text" id="searchInput" class="search-input" placeholder="Search client name or city...">
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Client</th>
              <th>Contact</th>
              <th>Track & Timing</th>
              <th>Question / Topic</th>
              <th>Amount</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="bookingsTbody">
            <tr>
              <td colspan="6" class="empty-state">
                Enter your <code>ADMIN_TOKEN</code> above to fetch captured bookings.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const tokenInput = document.getElementById("adminTokenInput");
    const loadBtn = document.getElementById("loadBtn");
    const errorBanner = document.getElementById("errorBanner");
    const tbody = document.getElementById("bookingsTbody");
    const searchInput = document.getElementById("searchInput");
    const statsRow = document.getElementById("statsRow");

    let allBookings = [];

    // Check localStorage or URL query parameter
    const urlParams = new URLSearchParams(window.location.search);
    const queryToken = urlParams.get("token") || localStorage.getItem("timeline_admin_token");
    if (queryToken) {
      tokenInput.value = queryToken;
      fetchBookings(queryToken);
    }

    loadBtn.addEventListener("click", () => {
      const token = tokenInput.value.trim();
      if (!token) {
        showError("Please enter your ADMIN_TOKEN.");
        return;
      }
      localStorage.setItem("timeline_admin_token", token);
      fetchBookings(token);
    });

    async function fetchBookings(token) {
      hideError();
      tbody.innerHTML = `<tr><td colspan="6" class="empty-state">Loading bookings from Razorpay...</td></tr>`;

      try {
        const res = await fetch(`/api/bookings?token=${encodeURIComponent(token)}`);
        const data = await res.json();

        if (!res.ok || data.error) {
          throw new Error(data.error || "Failed to load bookings");
        }

        allBookings = data.bookings || [];
        renderStats(allBookings);
        renderTable(allBookings);
      } catch (err) {
        showError(err.message === "unauthorized" ? "Invalid ADMIN_TOKEN. Please check your .env.local file." : err.message);
        tbody.innerHTML = `<tr><td colspan="6" class="empty-state">Failed to load bookings.</td></tr>`;
      }
    }

    function renderStats(list) {
      statsRow.style.display = "grid";
      document.getElementById("totalBookings").textContent = list.length;
      const rev = list.reduce((sum, b) => sum + (Number(b.amount) || 0), 0);
      document.getElementById("totalRevenue").textContent = "₹" + rev.toLocaleString("en-IN");
    }

    function renderTable(list) {
      if (!list.length) {
        tbody.innerHTML = `<tr><td colspan="6" class="empty-state">No captured bookings found yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map(b => {
        const waNumber = (b.whatsapp || "").replace(/\D/g, "").slice(-10);
        const waMsg = encodeURIComponent(`Hi ${b.name}, this is Harsh (@timelinebyharsh) regarding your 1:1 call booking for "${b.track}". Here is our Google Meet link: `);
        const waUrl = waNumber ? `https://wa.me/91${waNumber}?text=${waMsg}` : "#";

        return `
          <tr>
            <td>
              <strong style="color:var(--dark)">${escapeHtml(b.name)}</strong>
              <div style="font-size:0.775rem;color:var(--text-muted)">Age: ${escapeHtml(b.age || "-")} · ${escapeHtml(b.city || "-")}</div>
              <div style="font-size:0.775rem;color:var(--primary);font-weight:600">${escapeHtml(b.handle || "")}</div>
            </td>
            <td>
              <div>+91 ${escapeHtml(waNumber)}</div>
              <div style="font-size:0.775rem;color:var(--text-muted)">${escapeHtml(b.email)}</div>
            </td>
            <td>
              <span class="badge">${escapeHtml(b.track || "General")}</span>
              <div style="font-size:0.775rem;font-weight:600;margin-top:0.35rem;color:var(--dark)">
                ${escapeHtml(b.preferred_date || "-")} @ ${escapeHtml(b.preferred_time || "-")}
              </div>
            </td>
            <td style="max-width:280px">
              <p style="font-size:0.825rem;color:var(--text);line-height:1.45">${escapeHtml(b.question || "-")}</p>
            </td>
            <td>
              <strong style="color:var(--dark)">₹${escapeHtml(b.amount)}</strong>
              <div style="font-size:0.725rem;color:var(--text-muted)">${escapeHtml(b.method || "online")}</div>
            </td>
            <td>
              ${waNumber ? `<a href="${waUrl}" target="_blank" rel="noopener noreferrer" class="wa-btn">Message WhatsApp</a>` : "-"}
            </td>
          </tr>
        `;
      }).join("");
    }

    searchInput.addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase().trim();
      const filtered = allBookings.filter(b =>
        (b.name && b.name.toLowerCase().includes(q)) ||
        (b.city && b.city.toLowerCase().includes(q)) ||
        (b.handle && b.handle.toLowerCase().includes(q)) ||
        (b.track && b.track.toLowerCase().includes(q))
      );
      renderTable(filtered);
    });

    function showError(msg) {
      errorBanner.style.display = "block";
      errorBanner.textContent = msg;
    }

    function hideError() {
      errorBanner.style.display = "none";
    }

    function escapeHtml(str) {
      return String(str || "").replace(/[<>&"]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));
    }
  </script>
</body>
</html>
